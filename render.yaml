# Opcional: com este arquivo o Render configura tudo sozinho (Blueprint).
services:
  - type: web
    name: tecnologia-fora-de-controle
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python servidor.py
    healthCheckPath: /
    envVars:
      - key: TAXA
        value: "20"
